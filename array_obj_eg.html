<!DOCTYPE html>
<html>
<head>
<title>Array Object Example</title>
</head> 

<body>

<h2>Array Object Properties and Methods</h2>

<script>

let numbers = [10, 30, 20, 50, 40];

document.write("Original Array : " + numbers + "<br>");

document.write("Length of Array : " + numbers.length + "<br>");

numbers.push(60);
document.write("After push(60) : " + numbers + "<br>");

numbers.pop();
document.write("After pop() : " + numbers + "<br>");

numbers.sort();
document.write("After sort() : " + numbers + "<br>");

</script>

</body>
</html>
