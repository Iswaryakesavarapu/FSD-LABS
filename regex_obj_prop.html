<!DOCTYPE html>
<html>
<head>
<title>RegExp Object Example</title>
</head>

<body>

<h2>Regex Object Properties and Methods</h2>

<script>

let text = "JavaScript is a powerful language";

let pattern = /JavaScript/g;


document.write("Pattern Source : " + pattern.source + "<br>");
document.write("Is Global : " + pattern.global + "<br>");


let result = pattern.test(text);
document.write("Using test() : " + result + "<br>");


let match = pattern.exec(text);
document.write("Using exec() : " + match);

</script>

</body>
</html>
