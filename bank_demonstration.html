<!DOCTYPE html>
<html>
<head>
<title>Bank Denomination</title>
</head>

<body>

<h2>Bank Amount Denomination</h2>

<script>

let amount = parseInt(prompt("Enter deposited amount"));

let hundred = Math.floor(amount / 100);
amount = amount % 100;

let fifty = Math.floor(amount / 50);
amount = amount % 50;

let twenty = Math.floor(amount / 20);
amount = amount % 20;

let ten = Math.floor(amount / 10);
amount = amount % 10;

let five = Math.floor(amount / 5);
amount = amount % 5;

let two = Math.floor(amount / 2);
amount = amount % 2;

let one = amount;

alert(
hundred + " - 100's\n" +
fifty + " - 50's\n" +
twenty + " - 20's\n" +
ten + " - 10's\n" +
five + " - 5's\n" +
two + " - 2's\n" +
one + " - 1's"
);

</script>

</body>
</html>
