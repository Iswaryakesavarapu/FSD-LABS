<!DOCTYPE html>
<html>
<head>
    <title>HTML Table Examples</title>
</head>
<body>

    <h2>Employee Details</h2>

    <table border="2">
        <tr>
            <th rowspan="2">Emp ID</th>
            <th rowspan="2">Emp Name</th>
            <th colspan="2">Working Hours</th>
        </tr>

        <tr>
            <th>In Time</th>
            <th>Out Time</th>
        </tr>

        <tr>
            <td>100</td>
            <td>Employee A</td>
            <td>9:00 AM</td>
            <td>5:00 PM</td>
        </tr>

        <tr>
            <td>101</td>
            <td>Employee B</td>
            <td>10:00 AM</td>
            <td>6:00 PM</td>
        </tr>

        <tr>
            <td>102</td>
            <td>Employee C</td>
            <td colspan="2">On Leave</td>
        </tr>

    </table>

</body>
</html>
